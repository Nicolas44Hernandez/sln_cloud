version: 1
disable_existing_loggers: true

formatters:
  default:
    format: "%(asctime)s [%(threadName)s] [%(levelname)s] %(name)s: %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    formatter: default

  app:
    class: logging.handlers.RotatingFileHandler
    formatter: default
    filename: logs/app.log
    maxBytes: 52428800 # 50 Megabytes
    backupCount: 1

  api_rest:
    class: logging.handlers.RotatingFileHandler
    formatter: default
    filename: logs/api-rest.log
    maxBytes: 52428800 # 50 Megabytes
    backupCount: 1

  mongo:
    class: logging.handlers.RotatingFileHandler
    formatter: default
    filename: logs/mongo.log
    maxBytes: 52428800 # 50 Megabytes
    backupCount: 1
  
  rtd:
    class: logging.handlers.RotatingFileHandler
    formatter: default
    filename: logs/rtd.log
    maxBytes: 52428800 # 50 Megabytes
    backupCount: 1

root:
  level: WARN
  handlers: [console]

loggers:
  server.app:
    level: INFO
    handlers: [app]
    propagate: no

  server.rest_api:
      level: INFO
      handlers: [api_rest]
      propagate: no

  werkzeug:
      level: INFO
      handlers: [api_rest]
      propagate: no

  server.managers.mongo_db_manager:
    level: INFO
    handlers: [mongo]
    propagate: no
  
  server.managers.rtd_manager:
    level: INFO
    handlers: [rtd]
    propagate: no
